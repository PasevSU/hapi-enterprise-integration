name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Задай topics в GitHub (home-assistant, hacs, integration) и махни ignore-а.
      - uses: hacs/action@main
        with:
          category: integration
          ignore: topics
